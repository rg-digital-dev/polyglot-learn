name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  msrv:
    name: Builds with the declared minimum Rust
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      # The version comes from `rust-version` in runner/Cargo.toml, so the two can't drift apart.
      - id: msrv
        run: echo "version=$(grep -m1 '^rust-version' runner/Cargo.toml | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}

      - name: Build learn with Rust ${{ steps.msrv.outputs.version }}
        run: cargo build --locked --manifest-path runner/Cargo.toml

  runner:
    name: Unit tests and track selftest
    runs-on: ubuntu-24.04
    env:
      # Secrets aren't available to pull requests from forks; those skip the solutions check.
      HAS_SOLUTIONS_KEY: ${{ secrets.SOLUTIONS_DEPLOY_KEY != '' }}
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false   # the exercises have no dependencies (no go.sum)

      - name: Install PHP and Lua 5.4
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends php-cli lua5.4

      # Ubuntu's own Qt (6.4) is too old and split into many packages; use the
      # same Qt release as the tracks are developed against.
      - uses: jurplel/install-qt-action@v4
        with:
          version: 6.10.3
          cache: true

      - name: Lint install.sh
        run: shellcheck install.sh

      - name: Unit tests (spec parser, naming, literals, notes)
        run: cargo test --locked --manifest-path runner/Cargo.toml

      - name: Build learn
        run: cargo build --release --locked --manifest-path runner/Cargo.toml

      - name: Toolchains
        run: runner/target/release/learn doctor

      # Every untouched stub must fail on every track.
      - name: Selftest (stubs fail)
        run: runner/target/release/learn selftest --require-all

      # Reference solutions live in a private repo so they don't spoil the
      # exercises; a read-only deploy key lets CI check them out.
      - name: Check out reference solutions
        if: env.HAS_SOLUTIONS_KEY == 'true'
        uses: actions/checkout@v7
        with:
          repository: rg-digital-dev/polyglot-learn-solutions
          ssh-key: ${{ secrets.SOLUTIONS_DEPLOY_KEY }}
          path: solutions

      - name: Selftest (reference solutions pass)
        if: env.HAS_SOLUTIONS_KEY == 'true'
        run: runner/target/release/learn selftest --require-all --solutions solutions

      # The embedded UI (runner/web/dist) must match its sources.
      - uses: pnpm/action-setup@v6
        with:
          version: 11
      - name: Web UI is built and committed
        run: |
          cd runner/web
          pnpm install --frozen-lockfile
          pnpm build
          git diff --exit-code -- dist || (echo "runner/web/dist is out of date: run 'pnpm build' in runner/web and commit it" && exit 1)
