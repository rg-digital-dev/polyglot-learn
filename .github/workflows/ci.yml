name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  runner:
    name: Unit tests and track selftest
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Install PHP and Lua 5.4
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends php-cli lua5.4

      # Ubuntu's own Qt (6.4) is too old and split into many packages; use the
      # same Qt release as the tracks are developed against.
      - uses: jurplel/install-qt-action@v4
        with:
          version: 6.10.3
          cache: true

      - name: Unit tests (spec parser, naming, literals, notes)
        run: cargo test --manifest-path runner/Cargo.toml

      - name: Build learn
        run: cargo build --release --manifest-path runner/Cargo.toml

      - name: Toolchains
        run: runner/target/release/learn doctor

      # Every untouched stub must fail on every track.
      - name: Selftest (stubs fail)
        run: runner/target/release/learn selftest --require-all

      # The embedded UI (runner/web/dist) must match its sources.
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - name: Web UI is built and committed
        run: |
          cd runner/web
          pnpm install --frozen-lockfile
          pnpm build
          git diff --exit-code -- dist || (echo "runner/web/dist is out of date: run 'pnpm build' in runner/web and commit it" && exit 1)

      # Reference solutions are kept out of this repo (and out of CI) so they
      # don't spoil the exercises. Maintainers run, before each release:
      #   learn selftest --require-all --solutions <dir>
