name: Bug report
description: Something in `learn` or a generated exercise doesn't work
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: The command you ran, what you expected, and what you got.
    validations:
      required: true
  - type: input
    id: track
    attributes:
      label: Track and exercise
      placeholder: rust / parse-port
  - type: textarea
    id: doctor
    attributes:
      label: Output of `learn doctor`
      render: text
  - type: textarea
    id: output
    attributes:
      label: Output of `learn check -v` (if a check is involved)
      render: text
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: Windows 11 / macOS 15 / Arch Linux
