# The PHP path: the stages a PHP learner works through, in order.
# `use` takes a shared module from course.toml (`skip = [...]` leaves out some
# of its exercises); a stage with an `id` is this track's own, with exercises
# in tracks/php/extras/<slug>/. See docs/decisions/0001-track-paths.md.

[[stage]]
use = "syntax-primer"

[[stage]]
use = "foundations"

[[stage]]
use = "building-blocks"

[[stage]]
use = "values-and-references"

[[stage]]
use = "text-and-unicode"

[[stage]]
use = "numbers-and-division"

[[stage]]
use = "real-world-basics"

[[stage]]
use = "files-and-resources"

[[stage]]
id = "deeper-php"
title = "Deeper PHP"
exercises = [
  "card-suits",
  "money-value",
  "timestamps-trait",
  "read-lines",
]

[[stage]]
id = "web-framework"
title = "Project: web framework"
project = true
exercises = [
  "framework-http",
  "framework-router",
  "framework-middleware",
  "framework-validation",
  "framework-view",
  "framework-session",
  "framework-api",
  "framework-app",
]
