id = "php"
name = "PHP"

# No [lings] table: no maintained rustlings-style PHP repo was found.

[install]
windows = [
  "winget install --id PHP.PHP.8.5 -e",
  "To enable extensions later, copy php.ini-development to php.ini in the folder that holds php.exe and edit it.",
]
macos = ["brew install php"]
arch = ["sudo pacman -S php"]
debian = ["sudo apt install php-cli"]
fedora = ["sudo dnf install php-cli"]

