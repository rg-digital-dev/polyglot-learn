id = "typescript"
name = "TypeScript"

# No [lings] table: no maintained rustlings-style TypeScript repo was found.

[install]
# The last line of each list is TypeScript 7's tsc, for the type-check exercises.
windows = ["winget install --id OpenJS.NodeJS.LTS -e", "npm install -g typescript"]
macos = ["brew install node", "npm install -g typescript"]
arch = ["sudo pacman -S nodejs pnpm", "pnpm setup", "source ~/.bashrc", "pnpm add -g typescript"]
debian = [
  "sudo apt install curl unzip",
  "curl -fsSL https://fnm.vercel.app/install | bash",
  "source ~/.bashrc",
  "fnm install --lts",
  "npm install -g typescript",
]
fedora = [
  "sudo dnf install curl unzip",
  "curl -fsSL https://fnm.vercel.app/install | bash",
  "source ~/.bashrc",
  "fnm install --lts",
  "npm install -g typescript",
]

