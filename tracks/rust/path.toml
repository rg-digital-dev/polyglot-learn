# The Rust path: the stages a Rust learner works through, in order.
# `use` takes a shared module from course.toml (`skip = [...]` leaves out some
# of its exercises); a stage with an `id` is this track's own, with exercises
# in tracks/rust/extras/<slug>/. See docs/decisions/0001-track-paths.md.

[[stage]]
use = "syntax-primer"

[[stage]]
use = "foundations"

[[stage]]
use = "building-blocks"

[[stage]]
use = "values-and-references"

[[stage]]
use = "text-and-unicode"

[[stage]]
use = "numbers-and-division"

[[stage]]
use = "real-world-basics"

[[stage]]
use = "files-and-resources"

[[stage]]
id = "deeper-rust"
title = "Deeper Rust"
exercises = [
  "word-list",
  "text-slices",
  "robot-commands",
  "config-errors",
  "generic-stack",
  "shared-state",
]

[[stage]]
id = "rust-in-practice"
title = "Rust in Practice"
exercises = [
  "scoped-guard",
  "error-conversion",
  "custom-iterator",
  "borrow-or-own",
  "id-registry",
  "channel-workers",
]
