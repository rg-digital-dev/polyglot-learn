# The Lua path: the stages a Lua learner works through, in order.
# `use` takes a shared module from course.toml (`skip = [...]` leaves out some
# of its exercises); a stage with an `id` is this track's own, with exercises
# in tracks/lua/extras/<slug>/. See docs/decisions/0001-track-paths.md.

[[stage]]
use = "syntax-primer"

[[stage]]
use = "foundations"

[[stage]]
use = "building-blocks"

[[stage]]
use = "values-and-references"

[[stage]]
use = "text-and-unicode"

[[stage]]
use = "numbers-and-division"

[[stage]]
use = "real-world-basics"

[[stage]]
use = "files-and-resources"

[[stage]]
id = "deeper-lua"
title = "Deeper Lua"
exercises = [
  "account-classes",
  "vector-ops",
  "number-generator",
  "error-objects",
]
