id = "lua"
name = "Lua 5.4"

# No [lings] table: the "lualings" repos on GitHub (checked 2026-10-30) are
# single-author projects with 0-1 stars, a handful of commits, or an
# "actively in development" notice, so none counts as maintained yet.

[install]
windows = ["winget install --id DEVCOM.Lua -e"]
macos = [
  "brew install lua@5.4",
  "export PATH=\"$(brew --prefix lua@5.4)/bin:$PATH\"",
]
arch = ["sudo pacman -S lua54"]
debian = ["sudo apt install lua5.4"]
fedora = ["sudo dnf install lua"]

