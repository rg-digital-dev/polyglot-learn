id = "go"
name = "Go"

[lings]
name = "golings"
url = "https://github.com/mauricioabreu/golings"

[install]
windows = ["winget install --id GoLang.Go -e"]
macos = ["brew install go"]
arch = ["sudo pacman -S go"]
debian = ["sudo apt install golang-go   # Debian 13+ / Ubuntu 24.04+; older releases: use the tarball from https://go.dev/doc/install"]
fedora = ["sudo dnf install golang"]

