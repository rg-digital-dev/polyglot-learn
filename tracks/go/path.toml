# The Go path: the stages a Go learner works through, in order.
# `use` takes a shared module from course.toml (`skip = [...]` leaves out some
# of its exercises); a stage with an `id` is this track's own, with exercises
# in tracks/go/extras/<slug>/. See docs/decisions/0001-track-paths.md.

[[stage]]
use = "syntax-primer"

[[stage]]
use = "foundations"

[[stage]]
use = "building-blocks"

[[stage]]
use = "values-and-references"

[[stage]]
use = "text-and-unicode"

[[stage]]
use = "numbers-and-division"

[[stage]]
use = "real-world-basics"

[[stage]]
use = "files-and-resources"

[[stage]]
id = "deeper-go"
title = "Deeper Go"
exercises = [
  "embedded-logger",
  "pipeline",
  "with-timeout",
  "generic-set",
  "wrapped-errors",
]

# The project: one codebase that grows over eight stages, in one folder.
[[stage]]
id = "url-shortener"
title = "Project: URL shortener"
project = true
exercises = [
  "shortener-store",
  "shortener-handlers",
  "shortener-stats",
  "shortener-middleware",
  "shortener-concurrency",
  "shortener-timeouts",
  "shortener-expiry",
  "shortener-shutdown",
]
