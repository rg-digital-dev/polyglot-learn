id = "building-blocks"
title = "Building Blocks"
exercises = [
  "order-total",
  "shapes",
  "make-counter",
  "top-words",
  "slugify",
  "run-all",
]

# Track-only modules: exercises written natively for one language, for the
# features that don't exist everywhere. They live in tracks/<track>/extras/.

