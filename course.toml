# The shared library of modules: each lists exercise slugs in order, and every
# slug has a matching specs/<slug>.json. Which modules a track uses, in which
# order, and the track's own stages are in tracks/<lang>/path.toml.
# A module may also list `readings`: pages with no exercise, read with
# `learn read`. Each needs concepts/<id>.md and tracks/<lang>/<id>.md.

title = "polysyntax"

# Reading only, and optional: how each language writes the basics, before the
# first exercise. `exercises = []` stays written out for learn 0.3.x binaries,
# which require the field.
[[module]]
id = "syntax-primer"
title = "Syntax Primer"
readings = [
  "syntax-a-file",
  "syntax-variables",
  "syntax-types",
  "syntax-expressions",
  "syntax-control-flow",
  "syntax-functions",
  "syntax-collections",
]
exercises = []

[[module]]
id = "foundations"
title = "Foundations"
exercises = [
  "hello",
  "leap-year",
  "sum-of-multiples",
  "word-count",
  "parse-port",
  "top-scores",
]

[[module]]
id = "building-blocks"
title = "Building Blocks"
exercises = [
  "order-total",
  "shapes",
  "make-counter",
  "top-words",
  "slugify",
  "run-all",
]

[[module]]
id = "values-and-references"
title = "Values and References"
