  "int-setting",
  "validate-signup",
]

# Shared, but not on every track: QML can't read files without C++, and has no
# provided resource module.
[[module]]
id = "files-and-resources"
title = "Files and Resources"
tracks = ["typescript", "python", "rust", "go", "php", "lua"]
