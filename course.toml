# The course: modules in order, each listing exercise slugs in order.
# Every slug must have a matching specs/<slug>.json.

title = "polyglot-learn"

[[module]]
id = "foundations"
title = "Foundations"
exercises = [
  "hello",
  "leap-year",
  "sum-of-multiples",
  "word-count",
  "parse-port",
  "top-scores",
]

[[module]]
id = "building-blocks"
title = "Building Blocks"
exercises = [
  "order-total",
  "shapes",
  "make-counter",
  "top-words",
  "slugify",
  "run-all",
]

[[module]]
id = "real-world-basics"
title = "Real-world Basics"
exercises = [
  "error-context",
]

# Shared, but not on every track: QML can't read files without C++.
[[module]]
id = "files-and-resources"
title = "Files and Resources"
tracks = ["typescript", "rust", "go", "php", "lua"]
exercises = [
  "read-file",
]

# Track-only modules: exercises written natively for one language, for the
# features that don't exist everywhere. They live in tracks/<track>/extras/.

[[module]]
id = "deeper-rust"
title = "Deeper Rust"
track = "rust"
exercises = [
  "word-list",
