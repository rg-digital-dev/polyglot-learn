[package]
name = "polysyntax"
version = "0.5.0"
edition = "2021"
description = "Local, multi-language exercises generated from language-neutral specs"
license = "MIT"
repository = "https://github.com/rg-digital-dev/polysyntax"
rust-version = "1.88"

[[bin]]
name = "learn"
path = "src/main.rs"

[workspace]
members = ["core"]
# Plain `cargo test` and `cargo build` (as CI runs them) cover the engine too.
default-members = [".", "core"]

[dependencies]
learn-core = { path = "core" }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
toml = "0.8"
# `learn serve` (web UI)
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
rust-embed = { version = "8", features = ["mime-guess"] }
# Terminal output: colour (anstyle/anstream, already used by clap), width,
# and markdown rendering for lessons.
anstyle = "1"
anstream = "1"
terminal_size = "0.4"
unicode-width = "0.2"
pulldown-cmark = { version = "0.13", default-features = false }
# `learn` on a terminal (the TUI)
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
crossterm = "0.29"
lsp-server = "0.10"
crossbeam-channel = "0.5"

# Killing a test command together with everything it started (process groups / Job Objects).
[target."cfg(unix)".dependencies]
libc = "0.2"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_SystemInformation", "Win32_System_Threading"] }
