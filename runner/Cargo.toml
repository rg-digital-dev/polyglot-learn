[package]
name = "polyglot-learn"
version = "0.1.0"
edition = "2021"
description = "Local, multi-language exercises generated from language-neutral specs"
license = "MIT"
repository = "https://github.com/rg-digital-dev/polyglot-learn"
rust-version = "1.88"

[[bin]]
name = "learn"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
toml = "0.8"
# `learn serve` (web UI)
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
rust-embed = { version = "8", features = ["mime-guess"] }

# Killing a test command together with everything it started (process groups / Job Objects).
[target."cfg(unix)".dependencies]
libc = "0.2"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading"] }
