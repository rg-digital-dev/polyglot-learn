[package]
name = "learn-core"
version = "0.3.1"
edition = "2021"
description = "The engine behind `learn`: course, specs, progress, notes and checks"
license = "MIT"
repository = "https://github.com/rg-digital-dev/polyglot-learn"
rust-version = "1.88"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
toml = "0.8"

# Killing a test command together with everything it started (process groups / Job Objects).
[target."cfg(unix)".dependencies]
libc = "0.2"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_SystemInformation", "Win32_System_Threading"] }
